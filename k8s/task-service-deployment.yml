apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: microservices
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: dusky88/nms_task-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: MONGO_URI
              value: "mongodb://mongo.microservices.svc.cluster.local:27017/tasks"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq.microservices.svc.cluster.local:5672"
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5