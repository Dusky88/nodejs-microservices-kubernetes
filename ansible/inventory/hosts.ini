# ============================================================
# Ansible Inventory — Kubernetes Cluster
# ============================================================

[master]
k8s-master ansible_host=192.168.56.10 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[workers]
k8s-worker-1 ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'
k8s-worker-2 ansible_host=192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[k8s_cluster:children]
master
workers

[k8s_cluster:vars]
ansible_python_interpreter=/usr/bin/python3