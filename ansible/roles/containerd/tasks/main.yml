# ============================================================
# roles/containerd/tasks/main.yml
# Install & configure containerd as the container runtime
# ============================================================

---
- name: Add Docker/containerd GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Update apt cache after adding Docker repo
  apt:
    update_cache: true

- name: Install containerd
  apt:
    name: "containerd.io={{ containerd_version }}"
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup in containerd config
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Restart and enable containerd
  systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true

- name: Verify containerd is running
  systemd:
    name: containerd
  register: containerd_status

- name: Assert containerd is active
  assert:
    that: containerd_status.status.ActiveState == "active"
    fail_msg: "containerd failed to start!"