# ============================================================
# playbooks/setup_backups.yml
# Configure 10pm daily MongoDB backup cronjob on master
# Run: ansible-playbook -i inventory/hosts.ini playbooks/setup_backups.yml
# ============================================================

---
- name: Configure automated MongoDB backups
  hosts: master
  become: true
  vars:
    backup_dir: /var/backups/mongodb
    backup_script: /usr/local/bin/mongodb-backup.sh
    kubeconfig: /home/vagrant/.kube/config
    retention_days: 7

  tasks:
    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Deploy backup script
      copy:
        dest: "{{ backup_script }}"
        mode: '0755'
        content: |
          #!/bin/bash
          # ============================================
          # MongoDB Backup Script
          # Runs inside the running MongoDB pod via kubectl exec
          # ============================================

          set -euo pipefail

          export KUBECONFIG="{{ kubeconfig }}"
          BACKUP_DIR="{{ backup_dir }}"
          DATE=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="$BACKUP_DIR/mongodb_backup_$DATE.gz"
          RETENTION="{{ retention_days }}"

          echo "[$(date)] Starting MongoDB backup..."

          # Get the MongoDB pod name dynamically
          MONGO_POD=$(kubectl get pod -n microservices \
            -l app=mongodb \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$MONGO_POD" ]; then
            echo "[$(date)] ERROR: MongoDB pod not found!"
            exit 1
          fi

          echo "[$(date)] Found pod: $MONGO_POD"

          # Run mongodump inside the pod, stream gzip to local file
          kubectl exec -n microservices "$MONGO_POD" -- \
            mongodump --archive --gzip \
            > "$BACKUP_FILE"

          echo "[$(date)] Backup saved to: $BACKUP_FILE"
          ls -lh "$BACKUP_FILE"

          # Delete backups older than retention period
          find "$BACKUP_DIR" -name "mongodb_backup_*.gz" \
            -mtime +$RETENTION -delete

          echo "[$(date)] Cleanup: removed backups older than $RETENTION days"
          echo "[$(date)] Backup completed successfully."

    - name: Schedule nightly 10pm backup cronjob
      cron:
        name: "MongoDB nightly backup"
        user: vagrant
        minute: "0"
        hour: "22"
        job: "{{ backup_script }} >> /var/log/mongodb-backup.log 2>&1"
        state: present

    - name: Create logrotate config for backup logs
      copy:
        dest: /etc/logrotate.d/mongodb-backup
        content: |
          /var/log/mongodb-backup.log {
            weekly
            rotate 4
            compress
            missingok
            notifempty
          }

    - name: Run an immediate test backup
      become_user: vagrant
      command: "{{ backup_script }}"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: test_backup
      ignore_errors: true

    - name: Show backup test output
      debug:
        var: test_backup.stdout_lines

    # ── Deploy K8s CronJob for in-cluster backup option ──────
    - name: Copy K8s backup CronJob manifest
      copy:
        dest: /tmp/mongodb-backup-cronjob.yml
        content: |
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: mongodb-backup
            namespace: microservices
          spec:
            schedule: "0 22 * * *"    # 10:00 PM UTC every day
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 1
            jobTemplate:
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: mongodb-backup
                        image: mongo:6
                        command:
                          - /bin/bash
                          - -c
                          - |
                            DATE=$(date +%Y%m%d_%H%M%S)
                            mongodump \
                              --host=mongodb-service.microservices.svc.cluster.local \
                              --port=27017 \
                              --archive=/backup/mongodb_backup_${DATE}.gz \
                              --gzip
                            echo "Backup done: mongodb_backup_${DATE}.gz"
                        volumeMounts:
                          - name: backup-storage
                            mountPath: /backup
                    volumes:
                      - name: backup-storage
                        persistentVolumeClaim:
                          claimName: mongodb-backup-pvc
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: mongodb-backup-pvc
            namespace: microservices
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

    - name: Apply K8s backup CronJob
      become_user: vagrant
      command: kubectl apply -f /tmp/mongodb-backup-cronjob.yml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"