# ============================================================
# templates/alertmanager-config.yml
# AlertManager config — sends email on WARNING and CRITICAL
# Replace SMTP values before deploying
# ============================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'abasnetap@gmail.com'
  smtp_auth_username: 'abasnetap@gmail.com'
  smtp_auth_password: 'qhcjjfhrvvjcbnwb'   # Use Gmail App Password
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-alerts'

  routes:
    - match:
        severity: critical
      receiver: 'email-alerts'
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'email-alerts'
      repeat_interval: 4h

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'abasnetap@gmail.com'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - {{ .GroupLabels.instance }}'
        body: |
          {{ range .Alerts }}
          Alert:    {{ .Annotations.summary }}
          Details:  {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Started:  {{ .StartsAt }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']